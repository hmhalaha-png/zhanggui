<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>样张B 像素风</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #2a1d14; }
  #c {
    position: absolute; left: 0; top: 0;
    width: 843px; height: 390px;
    image-rendering: pixelated;
  }
  .hud {
    position: absolute; inset: 0; pointer-events: none;
    font-family: 'WenQuanYi Zen Hei Sharp', 'WenQuanYi Zen Hei', monospace;
    font-size: 12px; color: #3b2618;
  }
  .px {
    background: #f3e3bf;
    border: 3px solid #3b2618;
    box-shadow: 3px 3px 0 rgba(30, 18, 8, 0.55);
    padding: 2px 7px;
    line-height: 16px;
    white-space: nowrap;
  }
  .top { position: absolute; left: 6px; top: 6px; display: flex; gap: 8px; }
  .top .name { background: #7a2c22; color: #ffe7a0; border-color: #2a140c; font-size: 14px; }
  .top b { color: #a8342a; font-weight: normal; }
  .note { position: absolute; left: 6px; bottom: 9px; }
  .btns { position: absolute; right: 9px; bottom: 9px; display: flex; gap: 9px; }
  .btn {
    width: 42px; height: 42px; display: grid; place-items: center;
    background: #c8873e; color: #2a140c; border: 3px solid #2a140c;
    box-shadow: inset -3px -3px 0 #8f5a26, inset 3px 3px 0 #e9b36a, 3px 3px 0 rgba(30,18,8,0.55);
    font-size: 13px;
  }
  .say {
    position: absolute;
    background: #fffaf0; border: 3px solid #3b2618;
    padding: 1px 6px; line-height: 16px; white-space: nowrap;
  }
  .say::after {
    content: ''; position: absolute; left: var(--tail, 50%); bottom: -9px;
    width: 6px; height: 6px; background: #3b2618;
    box-shadow: 0 -3px 0 #fffaf0;
  }
  .tag {
    position: absolute; right: 9px; top: 9px;
    font-family: 'WenQuanYi Zen Hei', sans-serif; font-size: 11px;
    color: #fff; background: rgba(0, 0, 0, 0.5); padding: 2px 8px; border-radius: 10px;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="hud">
  <div class="top">
    <div class="px name">福来饭馆 一星</div>
    <div class="px">铜钱 <b>1,280</b> 文</div>
    <div class="px">第3日 申时</div>
    <div class="px">声望 <b>★★☆☆☆</b></div>
  </div>
  <div class="px note">今日食客 23 人 · 好评 18</div>
  <div class="btns">
    <div class="btn">菜谱</div>
    <div class="btn">采买</div>
    <div class="btn">建造</div>
    <div class="btn">伙计</div>
  </div>
  <div class="tag">样张 B · 像素风 · 代码绘制示意</div>
</div>
<script type="module" src="b-pixel.js"></script>
</body>
</html>
